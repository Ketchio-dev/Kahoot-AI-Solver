<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Youtube Ad Blocker Settings</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: sans-serif;
    }

    h2 {
      margin-top: 0;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }

    button {
      width: 100%;
      padding: 8px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #357ae8;
    }

    .slot-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .slot-row button {
      width: 90px;
      flex: none;
      background-color: #34a853;
      font-size: 12px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: green;
      text-align: center;
      display: none;
    }

    #modelStatus {
      margin-top: 6px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Settings Toggle Button -->
  <button id="toggleViewBtn"
    style="position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer; color: #bbb; font-size: 14px; width: auto; padding: 0 4px;">···</button>

  <!-- FAKE VIEW: Default -->
  <div id="fake-view" style="text-align: center; padding-top: 20px;">
    <h2 style="font-size: 18px; margin-bottom: 20px;">Youtube Ad Blocker</h2>

    <div
      style="background-color: #4CAF50; color: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; font-size: 34px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
      ON
    </div>

    <h3 style="color: #4CAF50; margin: 0;">PROTECTION ACTIVE</h3>
    <p style="color: #666; font-size: 12px; margin-top: 5px;">0 Ads Blocked today</p>

    <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px;">
      <label style="color: #999; font-size: 11px;">BLOCKING LEVEL: AGGRESSIVE</label>
    </div>
  </div>

  <!-- REAL VIEW: Hidden by default -->
  <div id="real-view" style="display: none;">
    <h2>Settings</h2>
    <div class="form-group">
      <label for="apiKey">Gemini API Key:</label>
      <input type="text" id="apiKey" placeholder="Enter your Gemini API Key">
    </div>
    <div class="form-group">
      <label for="openaiApiKey">OpenAI API Key:</label>
      <input type="text" id="openaiApiKey" placeholder="Enter your OpenAI API Key">
    </div>
    <button id="saveBtn" style="margin-bottom: 10px;">Save Keys &amp; Reload Models</button>
    <hr>

    <label>Model slots (loaded live from your API keys):</label>
    <div class="slot-row">
      <button id="solveSlot1">Alt+Z</button>
      <select id="slot1"></select>
    </div>
    <div class="slot-row">
      <button id="solveSlot2" style="background-color: #9334a8;">Alt+X</button>
      <select id="slot2"></select>
    </div>
    <div class="slot-row">
      <button id="solveSlot3" style="background-color: #10a37f;">Alt+C</button>
      <select id="slot3"></select>
    </div>

    <button id="refreshBtn" style="background-color: #666; margin-top: 8px;">Refresh model list</button>
    <div id="modelStatus"></div>
    <div id="status">Settings saved!</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
